name: ChatGPT MCP validation

on:
  pull_request:
    paths:
      - 'apps/chatgpt-mcp/**'
      - 'lib/resources.ts'
      - '.github/workflows/chatgpt-mcp.yml'
  push:
    branches: [feature/chatgpt-app]
    paths:
      - 'apps/chatgpt-mcp/**'
      - 'lib/resources.ts'
      - '.github/workflows/chatgpt-mcp.yml'

permissions:
  contents: read

jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/chatgpt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit --module nodenext --moduleResolution nodenext --target es2022 --allowImportingTsExtensions --types node src/server.ts src/http.ts src/tools.ts
